[package]
name = "tide"
version = "0.1.0"
edition = "2024"
publish = false
description = "The ponko.dev browser demo: hold the core against a tide of thousands of units."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tide"
path = "src/main.rs"

[dependencies]
# Public engine, pinned to an exact commit so the demo rebuilds identically.
# Only a window and 3D: no audio, inspector or gamepads, to keep the wasm small.
ponko = { git = "https://github.com/ponkoengine/ponko", rev = "c66d7c4f030f5e844bfacd62cc1f7b854d974d2e", default-features = false, features = ["window", "3d"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

name: Website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            games/target
            ~/.cargo/registry
          key: wasm-${{ runner.os }}-${{ hashFiles('games/Cargo.lock', 'games/engine.json') }}
      - run: npm ci
      - run: npm test
      - run: npm run test:games
      - run: cargo fmt --manifest-path games/Cargo.toml --check
      - run: cargo clippy --manifest-path games/Cargo.toml --all-targets -- -D warnings
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ponko-website
          path: dist
          retention-days: 7
